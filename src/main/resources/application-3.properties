# ===============================================
# Server Configuration
# ===============================================
server.port=${PORT:8080}
server.address=0.0.0.0

# ===============================================
# Database Configuration (Neon PostgreSQL)
# পাসওয়ার্ড কোডে নয়, Environment Variable এ রাখুন:
#   DB_URL, DB_USERNAME, DB_PASSWORD
# ===============================================
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-young-tree-b4avwban-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================================
# JPA / Hibernate Configuration
# ===============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================================
# File Upload Configuration
# ===============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================================
# File Storage Paths
# UserController (সেভ) ও WebConfig (সার্ভ) দুটোই এই প্রপার্টি ব্যবহার করে।
# হোস্টিংয়ে Persistent Disk লাগালে UPLOAD_DIR এ তার পাথ দিন (যেমন /data/avatars)
# (আগের spring.web.resources.static-locations লাইন সরানো হয়েছে)
# ===============================================
file.upload-dir=${UPLOAD_DIR:avatars}
file.upload-url-path=/avatars

# ===============================================
# Encoding Configuration
# ===============================================
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# ===============================================
# JWT Configuration
# JWT_SECRET অবশ্যই Environment Variable এ দিন (কমপক্ষে ৩২ অক্ষরের র‍্যান্ডম মান)
# ===============================================
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationInMs=86400000

# ===============================================
# CORS Configuration
# প্রোডাকশনে * এর বদলে নির্দিষ্ট ডোমেইন দিন (কমা দিয়ে একাধিক)
# ===============================================
app.cors.allowed-origins=${CORS_ORIGINS:*}

# ===============================================
# Logging Configuration
# ===============================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.com.yourcompany.ludo=INFO

# ===============================================
# Development Only: Circular Reference Allow
# ===============================================
spring.main.allow-circular-references=true
server.error.include-message=always
