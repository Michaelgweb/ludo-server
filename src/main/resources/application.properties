# ===============================================
# Server Configuration
# ===============================================
server.port=${PORT:8080}
server.address=0.0.0.0

# ===============================================
# Database Configuration (Neon PostgreSQL)
# Render Environment-এ DB_URL, DB_USER, DB_PASS সেট করুন
# ===============================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================================
# JPA / Hibernate Configuration
# ===============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================================
# File Upload Configuration
# ===============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================================
# File Storage Paths
# ===============================================
file.upload-dir=avatars
file.upload-url-path=/avatars
spring.web.resources.static-locations=classpath:/static/,file:avatars/

# ===============================================
# Encoding Configuration
# ===============================================
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# ===============================================
# JWT Configuration
# Render Environment-এ JWT_SECRET সেট করুন (কমপক্ষে ৩২ অক্ষর)
# ===============================================
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationInMs=86400000

# ===============================================
# CORS Configuration
# ===============================================
app.cors.allowed-origins=*

# ===============================================
# Logging Configuration
# ===============================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.com.yourcompany.ludo=INFO

# ===============================================
# Development Only: Circular Reference Allow
# ===============================================
spring.main.allow-circular-references=true
