# ===============================================
# Server
# ===============================================
server.port=${PORT:8080}
server.address=0.0.0.0
server.error.include-message=always

# Tomcat: ডিফল্টে মাত্র ৮১৯২ কানেকশন নেয়, WebSocket এর জন্য বাড়ানো
server.tomcat.max-connections=60000
server.tomcat.accept-count=2000
server.tomcat.threads.max=400

# ===============================================
# PostgreSQL (Neon)
# ===============================================
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-young-tree-b4avwban-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_Irde75nZRKDo}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000

# ===============================================
# Redis (চলমান গেমের স্টেট, টাইমার, লক)
# ===============================================
spring.data.redis.url=${REDIS_URL:redis://red-d0vok73ipnbc7384lj0g:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=32

# ===============================================
# JPA / Hibernate
# ===============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===============================================
# Scheduler (TurnTicker ও cleanup টাস্ক একসাথে চলে)
# ===============================================
spring.task.scheduling.pool.size=4

# ===============================================
# File Upload / Storage
# ===============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=avatars
file.upload-url-path=/avatars
spring.web.resources.static-locations=classpath:/static/,file:avatars/

# ===============================================
# Encoding
# ===============================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===============================================
# JWT
# ===============================================
app.jwtSecret=${JWT_SECRET:65gfhjr682jhk84d65gfhjr682jhk84d}
app.jwtExpirationInMs=86400000

# ===============================================
# CORS
# ===============================================
app.cors.allowed-origins=*

# ===============================================
# Logging
# ===============================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.com.yourcompany.ludo=INFO

# ===============================================
# Misc
# ===============================================
spring.main.allow-circular-references=true

spring.main.lazy-initialization=true
spring.jpa.hibernate.ddl-auto=none
spring.data.redis.repositories.enabled=false
spring.data.redis.repositories.enabled=false
