
# ===============================================
# SERVER
# ===============================================
server.port=${PORT:8080}
server.address=0.0.0.0
server.error.include-message=always

# ===============================================
# TOMCAT
# ===============================================
server.tomcat.max-connections=60000
server.tomcat.accept-count=2000
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=20

# ===============================================
# NEON POSTGRESQL
# ===============================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# ===============================================
# REDIS
# ===============================================
spring.data.redis.url=${REDIS_URL}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=32
spring.data.redis.lettuce.pool.max-idle=16
spring.data.redis.lettuce.pool.min-idle=4
spring.data.redis.repositories.enabled=false

# ===============================================
# JPA / HIBERNATE
# ===============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===============================================
# SCHEDULER
# ===============================================
spring.task.scheduling.pool.size=4

# ===============================================
# FILE UPLOAD
# ===============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=avatars
file.upload-url-path=/avatars
spring.web.resources.static-locations=classpath:/static/,file:avatars/

# ===============================================
# ENCODING
# ===============================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===============================================
# JWT
# ===============================================
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationInMs=86400000

# ===============================================
# CORS
# ===============================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ===============================================
# LOGGING
# ===============================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.com.yourcompany.ludo=INFO

# ===============================================
# MISC
# ===============================================
spring.main.allow-circular-references=true
